<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--void);color:var(--fg);line-height:1.5}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,3vw,34px);letter-spacing:-.04em}h2{font-size:17px}h3{font-size:21px}button,input{font:inherit;color:inherit}button{border:1px solid var(--mut);background:var(--panel-2);border-radius:10px;padding:9px 13px;cursor:pointer;transition:background .2s,transform .2s}button:hover{background:var(--raise)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid var(--beam);outline-offset:3px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{letter-spacing:.2em;font-size:10px;color:var(--aurora);margin-bottom:6px}.muted,small{color:var(--fg-dim)}small{font-size:11px}.intro{font-size:13px;margin-top:5px}.search{display:grid;grid-template-columns:1.1fr 1fr auto;gap:12px;align-items:end;margin:18px 0}.search label{display:block;font-size:11px;margin-bottom:5px}input{width:100%;min-width:0;border:1px solid var(--mut);border-radius:10px;background:var(--abyss);padding:11px}.primary{background:var(--beam);color:var(--on-beam);border:0;padding:12px 22px;font-weight:600}.workspace{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}.panel{min-width:0;padding:18px;border:1px solid var(--panel-3);border-radius:17px;background:var(--panel)}.hero{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}.photo{position:relative;aspect-ratio:1.2;display:grid;place-items:center;overflow:hidden;border-radius:13px;background:var(--abyss)}.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .6s}.photo:hover img{transform:scale(1.055)}.photo-placeholder{font-size:12px;color:var(--fg-dim);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}.photo-placeholder svg{width:50px;height:50px;stroke:var(--mut);fill:none;stroke-width:1.5}.price{display:block;font-size:29px;letter-spacing:-.04em;color:var(--fg-hi);margin:9px 0}.seller{font-size:12px;color:var(--fg-dim);overflow-wrap:anywhere}.detail-name{font-size:21px;overflow-wrap:anywhere}.signals{display:flex;justify-content:space-between;gap:12px;margin:16px 0;padding:12px 0;border-block:1px solid var(--panel-3)}.signals small{display:block}.signals strong{font-size:16px}.reason{font-size:13px;overflow-wrap:anywhere;min-height:38px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:11px;padding:8px 10px}.outcome{font-size:12px;color:var(--signal);margin-top:6px}.insights{display:grid;gap:14px}.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}.bars{display:grid;gap:8px}.bar-row{display:grid;grid-template-columns:25px 1fr 100px;align-items:center;gap:9px;background:transparent;border:0;padding:0;text-align:left;font-size:12px}.bar-track{background:var(--abyss);height:18px;border-radius:5px;overflow:hidden}.bar-fill{display:block;height:100%;background:var(--aurora);border-radius:5px;transform-origin:left;animation:grow .65s cubic-bezier(.2,.7,.2,1) both}.bar-row[aria-pressed=true] .bar-fill{background:var(--beam)}.bar-value{text-align:right;font-size:11px;white-space:nowrap}.bar-label{color:var(--fg-dim)}.chart-note{font-size:10px;color:var(--fg-dim);margin-top:7px}.trend{width:100%;height:136px;display:block;overflow:visible}.trend .gridline{stroke:var(--panel-3);stroke-width:1}.trend .route{fill:none;stroke:var(--signal);stroke-width:3;stroke-dasharray:7 5;animation:trace 1.2s ease-out both}.trend circle{fill:var(--signal);stroke:var(--panel);stroke-width:3;animation:pop .4s ease-out both}.trend text{fill:var(--fg-dim);font-size:11px}.trend .value{fill:var(--fg-hi);font-size:14px;font-weight:600}.delta{font-size:20px;color:var(--signal);letter-spacing:-.03em}.memory{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:16px 0 12px}.memory h2{font-size:16px}.memory p{font-size:12px;color:var(--fg-dim)}.candidates-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.nav{display:flex;gap:10px;align-items:center}.nav button{padding:5px 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.candidate{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;text-align:left;min-width:0;padding:9px;border-color:var(--panel-3);border-radius:13px}.candidate[aria-pressed=true]{border-color:var(--beam);background:var(--raise)}.candidate:hover{transform:translateY(-3px)}.candidate .photo{aspect-ratio:1;height:90px;width:90px}.candidate .photo-placeholder{font-size:9px;padding:6px}.candidate .photo-placeholder svg{width:30px;height:30px}.candidate .name{font-size:12px;font-weight:600;display:block;overflow-wrap:anywhere}.candidate .price{font-size:16px;margin:5px 0 0}.number{font-size:10px;color:var(--aurora)}.badge{font-size:9px;color:var(--beam);display:block;min-height:15px}.notice{font-size:12px;margin-top:12px;padding:10px;border-left:3px solid var(--flare);background:var(--panel-2);white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:10px;color:var(--fg-dim);margin-top:14px}.fade{animation:arrive .35s ease-out}.busy .photo:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent,color-mix(in srgb,var(--beam) 20%,transparent),transparent);animation:sweep 1s infinite}.motion-button{font-size:10px;padding:6px 10px;white-space:nowrap}[hidden]{display:none!important}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes arrive{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0}to{opacity:1}}@keyframes trace{from{opacity:0}to{opacity:1}}@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}.quiet *,.quiet *:after{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}@media(max-width:1000px){.candidate{grid-template-columns:1fr}.candidate .photo{width:100%;height:110px;aspect-ratio:auto}.hero{grid-template-columns:1fr 1fr}.signals{flex-wrap:wrap}.actions button{flex:1}}@media(max-width:720px){body{padding:16px}.workspace{grid-template-columns:1fr}.search{grid-template-columns:1fr 1fr}.search .primary{grid-column:1/-1}.hero .photo{aspect-ratio:1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.candidate{grid-template-columns:1fr}.candidate .photo{height:130px}.panel{padding:15px}.hero{gap:12px}.price{font-size:23px}.detail-name{font-size:17px}.chart-head h2{font-size:16px}.topline{align-items:start}.motion-button{max-width:95px;white-space:normal}}
.preferences{margin:20px 0;border:1px solid var(--mut);border-radius:16px;padding:17px;background:var(--panel)}.preferences summary{cursor:pointer;color:var(--fg-hi);font-size:13px}.preference-fields{display:flex;gap:18px;align-items:end;flex-wrap:wrap;margin:18px 0}.preference-fields label{display:grid;gap:8px;min-width:155px;font-size:12px}.preference-fields input[type=checkbox]{width:20px;height:20px}.preference-fields select{color:var(--fg-hi);background:var(--panel);border:1px solid var(--mut);border-radius:8px;padding:10px;min-height:44px}.preferences p{font-size:11px;line-height:1.8;color:var(--fg-dim);max-width:850px}#settings-status{color:var(--beam);min-height:20px;margin-top:12px}</style></head><body><header class="topline"><div><p class="eyebrow">SHOPPING / COSMOS</p><h1 data-copy="title"></h1><p class="intro muted" data-copy="intro"></p></div><button id="motion" class="motion-button"></button></header>
<form id="search" class="search"><div><label for="query" data-copy="query"></label><input id="query" autocomplete="off" maxlength="300" required></div><div><label for="criteria" data-copy="criteria"></label><input id="criteria" autocomplete="off" maxlength="500" aria-describedby="criteria-help"></div><button type="submit" class="primary" data-copy="search"></button></form><small id="criteria-help" data-copy="criteria_help" hidden></small>
<main><details id="preferences" class="preferences"><summary data-copy="settings_title"></summary><div class="preference-fields"><label><span data-copy="price_checks"></span><input id="price-checks" type="checkbox"></label><label><span data-copy="check_hours"></span><select id="check-hours"><option>6</option><option>12</option><option>24</option><option>72</option></select></label><label><span data-copy="drop_percent"></span><select id="drop-percent"><option value="7">7%</option><option value="10">10%</option><option value="15">15%</option><option value="20">20%</option></select></label><button id="save-settings" data-copy="settings_save"></button></div><p data-copy="settings_help"></p><p id="settings-status" role="status" aria-live="polite"></p></details><div class="workspace"><section class="panel" id="detail" hidden><div class="hero"><div id="hero-image"></div><div><small data-copy="detail"></small><h3 id="detail-name" class="detail-name"></h3><strong id="detail-price" class="price"></strong><span id="detail-seller" class="seller"></span></div></div><div class="signals" id="signals"></div><p id="reason" class="reason"></p><small id="observed"></small><p id="outcome" class="outcome"></p><div class="actions"><button id="open" data-copy="open"></button><button id="bought" data-copy="bought"></button><button id="dropped" data-copy="dropped"></button><button id="still_looking" data-copy="still_looking"></button></div></section>
<section class="insights"><div class="panel"><div class="chart-head"><h2 data-copy="price_chart"></h2><small id="chart-currency"></small></div><div id="price-chart" class="bars"></div><p class="chart-note" data-copy="price_scope"></p></div><div class="panel" id="history"><div class="chart-head"><h2 data-copy="change"></h2><strong id="price-delta" class="delta"></strong></div><small id="history-title"></small><div id="prices"></div><p id="history-empty" class="chart-note" data-copy="no_history"></p><p class="chart-note" data-copy="change_help"></p></div></section></div>
<section><div class="memory"><small data-copy="saved"></small><h2 id="saved-query"></h2><p id="saved-criteria"></p></div><div class="candidates-head"><h2 data-copy="candidates"></h2><nav class="nav" id="nav"><button id="prev" data-copy="prev"></button><small id="page"></small><button id="next" data-copy="next"></button></nav></div><div class="grid" id="results"></div><p id="empty" class="muted"></p><p class="chart-note" data-copy="basis"></p></section><div id="notice" class="notice" role="status" aria-live="polite" hidden></div></main><footer data-copy="privacy"></footer>
<script>(()=>{'use strict';let settingsSaving=false;let prefDirty=false,prefBase='',settingsOpened=false;let state={},selected=0,busy=false,disposed=false,token='',historyToken='',paused=false,visible=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)');paused=reduced.matches;const $=id=>document.getElementById(id),copy=k=>state.copy?.[k]||'',el=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text??'';if(cls)e.className=cls;return e};
function motion(){document.body.classList.toggle('quiet',paused||reduced.matches||!visible);$('motion').textContent=copy(paused?'motion':'pause');$('motion').setAttribute('aria-pressed',String(!paused))}
function photo(row){const box=el('div','','photo');const missing=()=>{const placeholder=el('div',copy('no_image'),'photo-placeholder');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 64 64');svg.innerHTML='<rect x="9" y="12" width="46" height="40" rx="6"/><circle cx="23" cy="25" r="4"/><path d="m12 45 13-12 9 8 8-7 11 10"/>';placeholder.prepend(svg);box.replaceChildren(placeholder)};if(typeof row.image==='string'&&row.image.startsWith('data:image/jpeg;base64,')&&row.image.length<=8192){const img=document.createElement('img');img.src=row.image;img.alt=row.title;img.decoding='async';img.onerror=missing;box.append(img)}else missing();return box}
function notice(text){if(settingsSaving)$('settings-status').textContent=text;$('notice').textContent=text;$('notice').hidden=!text}function controls(){document.querySelectorAll('button').forEach(b=>b.disabled=busy);$('prev').disabled=busy||!state.page;$('next').disabled=busy||state.page+1>=state.pages;$('open').disabled=busy||!state.items?.find(r=>r.index===selected)?.can_open;$('search').setAttribute('aria-busy',String(busy));document.body.classList.toggle('busy',busy);$('motion').disabled=false}
function detail(){const r=state.items?.find(r=>r.index===selected);$('detail').hidden=!r;if(!r)return;$('hero-image').replaceChildren(photo(r));$('hero-image').classList.remove('fade');void $('hero-image').offsetWidth;$('hero-image').classList.add('fade');$('detail-name').textContent=r.title;$('detail-price').textContent=r.price;$('detail-seller').textContent=r.seller;$('reason').textContent=r.note||copy('unknown');$('observed').textContent=copy('observed')+' · '+r.seen_at.replace('T',' ');$('outcome').textContent=r.outcome?copy(r.outcome):'';$('signals').replaceChildren(...['rating','reviews','official'].map(k=>{const box=el('div');const value=k==='official'?(typeof r.signals?.official_store==='boolean'?copy(r.signals.official_store?'yes':'no'):copy('unknown')):r.signals?.[k==='reviews'?'review_count':k]??copy('unknown');box.append(el('small',copy(k)),el('strong',value));return box}));document.querySelectorAll('[data-index]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===selected)));controls()}
function bars(){const groups=new Map();for(const r of state.items||[]){if(!groups.has(r.currency))groups.set(r.currency,[]);groups.get(r.currency).push(r)}const children=[];for(const [currency,rows] of groups){if(groups.size>1)children.push(el('small',currency));const max=Math.max(1,...rows.map(r=>r.amount||0));for(const r of rows){const b=el('button','','bar-row');b.type='button';b.dataset.index=r.index;b.setAttribute('aria-label',r.title+' · '+r.price);b.title=r.title+' · '+r.price;const track=el('span','','bar-track');const fill=el('span','','bar-fill');fill.style.width=100*(r.amount||0)/max+'%';track.append(fill);b.append(el('span',String(r.index).padStart(2,'0'),'bar-label'),track,el('span',r.price,'bar-value'));b.onclick=()=>{selected=r.index;detail()};children.push(b)}}$('price-chart').replaceChildren(...children);$('chart-currency').textContent=groups.size===1?[...groups.keys()][0]:''}
function svgEl(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function history(){const key=JSON.stringify([state.history,state.history_title,state.lang]);if(key===historyToken)return;historyToken=key;const rows=state.history||[];$('history-title').textContent=state.history_title||'';$('prices').replaceChildren();$('history-empty').hidden=rows.length===2;$('price-delta').textContent='';if(rows.length!==2)return;const svg=svgEl('svg',{viewBox:'0 0 420 136',class:'trend',role:'img','aria-label':state.history_title+': '+rows.map(r=>r.price+' '+r.ts).join(' → ')});svg.append(svgEl('line',{x1:36,x2:388,y1:102,y2:102,class:'gridline'}),svgEl('text',{x:14,y:106},'0'));const max=Math.max(1,...rows.map(r=>r.amount))*1.5;const y=rows.map(r=>102-80*r.amount/max);svg.append(svgEl('path',{d:`M 90 ${y[0]} L 330 ${y[1]}`,class:'route'}));rows.forEach((r,i)=>{const x=i?330:90;svg.append(svgEl('circle',{cx:x,cy:y[i],r:6}),svgEl('text',{x,y:y[i]-14,'text-anchor':'middle',class:'value'},r.price),svgEl('text',{x,y:122,'text-anchor':'middle'},r.ts.slice(0,10)))});$('prices').append(svg);const before=rows[0].amount,delta=rows[1].amount-before;$('price-delta').textContent=before?(delta>0?'+':'')+(100*delta/before).toFixed(1)+'%':''}
function render(next){if(disposed)return;const oldRevision=state.revision;state=next||{};state.items=state.items||[];const pref=state.preferences||{};if(!prefDirty){$('price-checks').checked=pref.price_checks!==false;$('check-hours').value=String(pref.check_hours||12);$('drop-percent').value=String(pref.drop_percent||7);prefBase=pref.revision||''}if(state.open_settings&&!settingsOpened){$('preferences').open=true;settingsOpened=true;requestAnimationFrame(()=>$('preferences').scrollIntoView({block:'start'}))}document.documentElement.lang=state.lang||'en';document.querySelectorAll('[data-copy]').forEach(e=>e.textContent=copy(e.dataset.copy));$('criteria').placeholder=copy('criteria_help');$('saved-query').textContent=state.query||copy('empty');$('saved-criteria').textContent=state.criteria||'';const key=JSON.stringify([state.items,state.lang,state.revision]);if(key!==token){token=key;if(oldRevision!==state.revision||!state.items.some(r=>r.index===selected))selected=state.items[0]?.index||0;$('results').replaceChildren(...state.items.map(r=>{const b=el('button','','candidate');b.type='button';b.dataset.index=r.index;const text=el('span');text.append(el('span',String(r.index).padStart(2,'0'),'number'),el('span',r.mark,'badge'),el('span',r.title,'name'),el('span',r.price,'price'));b.append(photo(r),text);b.onclick=()=>{selected=r.index;detail()};return b}));bars();detail()}$('empty').hidden=!!state.items.length;$('empty').textContent=copy(state.query?'none':'empty');$('nav').hidden=!state.items.length;$('page').textContent=(state.page+1)+' / '+state.pages;history();if(!busy)notice(state.notice||'');controls();motion();cosmos.resize(document.body.scrollHeight)}
async function call(action,args={}){if(busy||disposed)return;busy=true;controls();notice(copy('pending'));try{const result=await cosmos.call('shopping',{action,...args});if(!disposed)notice(typeof result==='string'?result:JSON.stringify(result));return result}catch{if(!disposed)notice(copy('error'))}finally{busy=false;if(!disposed){controls();cosmos.resize(document.body.scrollHeight)}}}for(const id of ['price-checks','check-hours','drop-percent'])$(id).onchange=()=>{prefDirty=true;$('settings-status').textContent=''};$('save-settings').onclick=async()=>{settingsSaving=true;const revision=prefBase;const result=await call('settings',{preferences:{price_checks:$('price-checks').checked,check_hours:Number($('check-hours').value),drop_percent:Number($('drop-percent').value)},preferences_revision:revision});if(result===copy('settings_saved')){prefDirty=false;prefBase=state.preferences?.revision||''}settingsSaving=false};function search(e){e.preventDefault();const query=$('query').value.trim();if(!query){$('query').focus();return}const criteria=$('criteria').value.trim();call('search',{query,...(criteria?{criteria}:{})})}$('search').addEventListener('submit',search);document.querySelector('button[type=submit]').onclick=search;for(const a of ['prev','next'])$(a).onclick=()=>call(a,{revision:state.revision});for(const a of ['open','bought','dropped','still_looking'])$(a).onclick=()=>call(a,{index:selected,revision:state.revision});$('motion').onclick=()=>{paused=!paused;motion()};const reduce=()=>{paused=reduced.matches;motion()};reduced.addEventListener('change',reduce);cosmos.onState(render);cosmos.onLifecycle(e=>{visible=e.visible!==false;if(e.disposed){disposed=true;reduced.removeEventListener('change',reduce)}motion()})})();</script></body></html>
