# ★에이전트마다 같은 이름의 그물이 있다★ — `tests/test_i18n.py`는 **모든** 에이전트가
# 갖는다(각자 자기 번역을 지고 다니므로). 기본 임포트 방식은 그 둘을 같은 모듈로
# 읽어 *"basename이 겹친다"* 며 수집을 통째로 멈춘다.
#
# ⚠️ 그때 한 폴더만 골라 돌리면 초록이 나온다 — 그래서 ★못 도는 그물이 있는지도
# 모른 채★ 넘어가기 쉽다. 파일 경로로 모듈을 가르게 해서 그 상황 자체를 없앤다.
[pytest]
addopts = --import-mode=importlib
testpaths = .
