# Flight finder — Cosmos market agent manifest
# Spec: https://github.com/honeyground-org/cosmos-billy/blob/main/docs/AGENT_GUIDE.md
#
# ★The source text is English★ Per-language text lives in the market index
# entry (`title_i18n` / `description_i18n`) — readers see their own language and
# fall back to English when one is missing.
id: honeyground-org/flights
type: feature
version: 0.3.0
contract: plugin/v1
title: Flight finder
# ★설치 화면은 코드를 받기 **전에** 그려진다★ — 그래서 무엇을 기억하는지가 여기
# 없으면 사용자는 설치한 뒤에야 그것을 알게 된다.
description: >-
  Fare search is everywhere; this remembers. It keeps where you were trying to
  go, what day you meant to leave and what the fare was each time it looked, so
  the next search can say "that route dropped 80,000 since you looked" and draw
  the trend rather than one number. Four flights sit side by side on one screen
  with the price, how many times you change planes and how long the whole trip
  takes — say "show the next ones" for more. The one it pushes is the cheapest
  of the ones with the fewest stops, and the card says so; the cheapest overall
  is marked separately, because on a flight the cheapest is often the hardest.
  It watches in the background too: if a fare you are still thinking about goes
  down it tells you at that moment instead of waiting for you to open a screen,
  and it stops the moment you say you booked — or the day the plane leaves.
# ★번역은 **인덱스 항목**에 있다★ 매니페스트는 `title_i18n`·`description_i18n`을
# 읽지 않는다(검증기가 *"this version ignores it"* 이라고 말한다). 무시되는 칸을
# 여기 적어 두면 다음 사람은 있는 줄 알고 배선했다가 영영 빈 값을 받는다.
# 다섯 언어 번역은 cosmos-market-index 의 이 항목에 있다.
author: honeyground-org
license: MIT
homepage: https://github.com/honeyground-org/cosmos-agents/tree/main/flights
entry: flights_scout:FlightsPlugin
tools:
  - flights
# ⚠️ 로더가 **코드 ∪ 매니페스트**로 역량을 넓히므로 둘이 어긋나면 승인된 것과 집행되는
# 것이 갈린다. 코드의 `capabilities`와 반드시 같아야 한다.
capabilities:
  - network
  - memory
requires_desktop: false
