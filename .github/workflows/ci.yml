# QA gate. Every agent's tests import the cosmos contracts, which lives in the private
# honeyground-org/cosmos-aios repository. The default GITHUB_TOKEN cannot read
# another private repo, so this needs a repository secret:
#
#   COSMOS_AIOS_READ_TOKEN  — a fine-grained PAT with Contents: read on
#                             honeyground-org/cosmos-aios (Settings → Secrets)
#
# Until that secret exists the checkout step fails and the gate is red on
# purpose — a green run that skipped the tests would be worse.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: cosmos-agents
      - uses: actions/checkout@v4
        with:
          repository: honeyground-org/cosmos-aios
          token: ${{ secrets.COSMOS_AIOS_READ_TOKEN }}
          path: cosmos-billy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e 'cosmos-billy[dev]'
      - run: bash scripts/qa.sh
        working-directory: cosmos-agents
        env:
          COSMOS_HOME: ${{ github.workspace }}/cosmos-billy
