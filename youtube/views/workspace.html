<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:dark;color:var(--fg-hi);background:var(--void);font-size:15px}
*{box-sizing:border-box}body{margin:0;padding:28px;line-height:1.6}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--mut);background:var(--panel-2);color:inherit;border-radius:10px;padding:9px 14px;transition:background .18s,transform .18s}button:hover{background:var(--raise)}button:active{transform:translateY(1px)}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid var(--beam);outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,4vw,38px);font-weight:650;letter-spacing:-.035em;line-height:1.2}h2{font-size:19px}h3{font-size:16px}small,.muted{color:var(--fg-dim)}.eyebrow{font-size:11px;color:var(--aurora);letter-spacing:.2em;font-weight:700;margin-bottom:12px}.intro{margin-top:12px;max-width:650px}.layout{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.7fr);gap:22px;margin-top:28px}.panel{border:1px solid var(--panel-3);border-radius:18px;padding:22px;background:linear-gradient(145deg,var(--panel-2),var(--panel))}.panel>p{margin:8px 0 18px;font-size:13px}.timeline{list-style:none;padding:0;margin:18px 0;border-left:2px solid var(--panel-3)}.publication{position:relative;padding:0 0 24px 19px;overflow-wrap:anywhere}.publication:before{content:'';position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--aurora)}.publication small{display:block;margin-top:6px}.badge{display:inline-block;margin-top:8px;padding:3px 8px;background:var(--raise);border-radius:6px;font-size:12px}.help{border-top:1px solid var(--panel-3);padding-top:16px}.search{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}label{display:block;font-size:13px;color:var(--fg)}.query{width:100%;min-width:0;background:var(--abyss);border:1px solid var(--mut);border-radius:10px;color:var(--fg-hi);padding:12px}.search .primary{background:var(--beam);color:var(--on-beam);border-color:transparent;font-weight:650}.results{display:grid;gap:9px;margin-top:14px;max-height:320px;overflow-y:auto;padding:3px}.result{display:grid;grid-template-columns:32px 1fr;text-align:left;gap:10px;width:100%;padding:13px;background:var(--panel)}.result[aria-pressed=true]{background:var(--raise);border-color:var(--beam)}.result .number{color:var(--aurora);font-size:20px;font-variant-numeric:tabular-nums}.result .name{display:block;font-weight:600;overflow-wrap:anywhere}.result small{display:block}.detail{margin-top:20px;border-top:1px solid var(--mut);padding-top:18px}.detail h3{margin:10px 0}.description,.summary{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.description{max-height:190px;overflow:auto;color:var(--fg)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.basis{font-size:12px;color:var(--flare);border-left:3px solid var(--flare);padding-left:10px;margin:16px 0}.summary{background:var(--abyss);padding:15px;border-radius:10px}.notice{margin-top:18px;padding:12px 16px;border:1px solid var(--mut);border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}.warning{color:var(--flare);border-color:var(--mut)}footer{margin-top:24px;font-size:12px;color:var(--fg-dim)}.regulars{margin-top:22px}.regulars ul{padding-left:18px;font-size:14px}.updated{font-size:12px;color:var(--fg-dim)}.arrive{animation:arrive .24s ease-out}.busy:before{content:'';display:inline-block;width:9px;height:9px;background:var(--beam);border-radius:50%;margin-right:10px;animation:pulse .8s ease-in-out infinite alternate}[hidden]{display:none!important}@keyframes arrive{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes pulse{to{opacity:.35}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}@media(max-width:700px){body{padding:16px}.layout{grid-template-columns:1fr;gap:16px}.panel{padding:18px}.timeline{max-height:220px;overflow:auto}.search button{flex:1}.results{max-height:280px}}
body.quiet *,body.quiet *:before{animation-play-state:paused!important}
.header-row{display:flex;justify-content:space-between;align-items:start;gap:12px}.motion-button{font-size:11px;white-space:nowrap}.result{grid-template-columns:112px 1fr;align-items:center}.thumb{display:block;width:112px;height:68px;object-fit:cover;border-radius:7px;background:var(--abyss)}.thumb-placeholder{display:grid;place-items:center;font-size:10px;color:var(--fg-dim);border:1px solid var(--panel-3)}.hero-thumb{width:100%;height:195px;object-fit:contain;background:var(--abyss);border-radius:12px;margin:12px 0;animation:arrive .3s ease-out}.activity{margin:16px 0 22px;padding:16px;background:var(--abyss);border-radius:13px}.activity h3{font-size:14px}.activity svg{display:block;width:100%;height:155px;margin:8px 0}.activity .column{fill:var(--aurora);transform-origin:center bottom;animation:grow .65s ease-out both;transform-box:fill-box}.activity text{fill:var(--fg-dim);font-size:11px}.activity .value{fill:var(--fg-hi);font-weight:600;font-size:14px}.activity .baseline{stroke:var(--panel-3);stroke-width:1}.activity .privacy-row{display:flex;gap:8px;flex-wrap:wrap;font-size:11px}.privacy-row span{border:1px solid var(--panel-3);padding:3px 7px;border-radius:5px}.timeline{max-height:260px;overflow:auto}.publications-help{font-size:11px}.quiet *{animation:none!important;transition:none!important}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@media(max-width:700px){.header-row{display:block}.motion-button{margin-top:10px}.result{grid-template-columns:92px 1fr}.thumb{width:92px;height:62px}.hero-thumb{height:155px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.view-switch{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 0}.view-switch button[aria-pressed=true]{border-color:var(--beam);background:var(--raise)}body[data-mode=research] .channel-panel{display:none}body[data-mode=research] .layout{grid-template-columns:minmax(0,1fr)}body[data-mode=research] .research-content{display:grid;grid-template-columns:minmax(220px,.9fr) minmax(0,1.2fr);gap:24px}body[data-mode=research] .detail{margin:0;padding:0 0 0 24px;border-top:0;border-left:1px solid var(--mut)}body[data-mode=research] .results{max-height:570px}.back-results{display:none}.research-panel{min-width:0}.research-content>section{min-width:0}.result:focus-visible{outline-offset:-3px}@media(max-width:700px){body[data-mode=research] .research-content{grid-template-columns:minmax(0,1fr);gap:18px}body[data-mode=research] .detail{padding:18px 0 0;border-left:0;border-top:1px solid var(--mut)}.back-results{display:block;margin-top:14px}}
</style></head><body>
<header class="header-row"><div><p class="eyebrow">YOUTUBE / COSMOS</p><h1 data-copy="title"></h1><p class="intro muted" data-copy="intro"></p></div><button id="motion" class="motion-button"></button></header>
<nav class="view-switch" aria-label="Workspace"><button id="mode-channel" data-copy="layout_channel" aria-pressed="true"></button><button id="mode-research" data-copy="layout_research" aria-pressed="false"></button></nav>
<div id="warning" class="notice warning" role="status" hidden></div>
<main class="layout">
<section class="panel channel-panel" aria-labelledby="publications-title"><h2 id="publications-title" data-copy="channel"></h2><p class="muted" data-copy="recorded"></p><section id="activity" class="activity"><h3 data-copy="activity"></h3><div id="activity-chart"></div><div id="privacy-counts" class="privacy-row"></div><small data-copy="activity_help"></small></section><ol id="uploads" class="timeline"></ol><p id="empty-uploads" class="muted" data-copy="empty_uploads"></p><p class="help muted" data-copy="upload_help"></p><section id="history" class="regulars" hidden><h3 data-copy="history"></h3><ul id="regulars"></ul><small data-copy="history_help"></small></section></section>
<section class="panel research-panel" aria-labelledby="research-title"><h2 id="research-title" data-copy="research"></h2><form id="search" class="search"><label for="query" data-copy="query"></label><input id="query" class="query" autocomplete="off" maxlength="300"><button class="primary" type="submit" data-copy="search"></button><button id="trending" type="button" data-copy="trending"></button></form><div class="research-content"><section><h3 data-copy="results"></h3><p id="updated" class="updated"></p><div id="results" class="results"></div><p id="empty-results" class="muted"></p>
</section><section id="detail" class="detail" aria-labelledby="detail-title"><small data-copy="detail"></small><h3 id="detail-title"></h3><img id="detail-image" class="hero-thumb" hidden><p id="channel" class="muted"></p><p id="description" class="description"></p><div id="actions" class="actions" hidden><button id="open" data-copy="open"></button><button id="info" data-copy="info"></button><button id="summarize" data-copy="summarize"></button></div><p class="basis" data-copy="basis"></p><p id="summary" class="summary" hidden></p><button class="back-results" id="back-results" data-copy="back_results"></button></section></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div></section></main><footer data-copy="privacy"></footer>
<script>
(()=>{'use strict';
let state={},selected='',resultToken='',channelToken='',busy=false,disposed=false,visible=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)');let paused=reduced.matches;
const $=id=>document.getElementById(id),copy=k=>state.copy?.[k]||'',videos=()=>state.latest?.videos||[];
function element(tag,text,cls){const e=document.createElement(tag);e.textContent=text||'';if(cls)e.className=cls;return e}
function status(text,pending=false){$('notice').textContent=text;$('notice').hidden=!text;$('notice').classList.toggle('busy',pending)}
function setBusy(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value);$('search').setAttribute('aria-busy',String(value))}
function validImage(value){return typeof value==='string'&&value.startsWith('data:image/jpeg;base64,')&&value.length<=8192?value:''}
function thumbnail(video){const src=validImage(video.image);if(!src)return element('span',copy('no_image'),'thumb thumb-placeholder');const img=document.createElement('img');img.className='thumb';img.src=src;img.alt=video.title;img.onerror=()=>img.replaceWith(element('span',copy('no_image'),'thumb thumb-placeholder'));return img}
function motion(){document.body.classList.toggle('quiet',paused||reduced.matches||!visible);$('motion').textContent=copy(paused?'motion':'pause')}
function svgEl(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function activity(rows){const groups=new Map();for(const row of rows){const date=row.uploaded_at?.slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(date))groups.set(date,(groups.get(date)||0)+1)}const entries=[...groups].sort((a,b)=>a[0].localeCompare(b[0]));$('activity-chart').replaceChildren();if(entries.length){const svg=svgEl('svg',{viewBox:'0 0 340 155',role:'img','aria-label':copy('activity')+': '+entries.map(([d,n])=>d+' '+n).join(', ')});svg.append(svgEl('line',{x1:18,x2:328,y1:120,y2:120,class:'baseline'}),svgEl('text',{x:2,y:124},'0'));const step=290/entries.length,max=Math.max(...entries.map(e=>e[1]));entries.forEach(([date,count],i)=>{const x=28+i*step,h=count/max*85;svg.append(svgEl('rect',{x,y:120-h,width:Math.min(step-8,45),height:h,rx:5,class:'column'}),svgEl('text',{x:x+Math.min(step-8,45)/2,y:110-h,'text-anchor':'middle',class:'value'},count),svgEl('text',{x:x+Math.min(step-8,45)/2,y:142,'text-anchor':'middle'},date.slice(5)));});$('activity-chart').append(svg)}$('privacy-counts').replaceChildren(...['private','unlisted','public'].map(p=>element('span',copy(p)+' · '+rows.filter(r=>r.privacy===p).length)));}
function showDetail(){const video=videos().find(v=>v.id===selected);const src=validImage(video?.image);$('detail-image').hidden=!src;if(src){$('detail-image').src=src;$('detail-image').alt=video.title;}$('detail-title').textContent=video?.title||copy('choose');$('channel').textContent=video?.channel||'';$('description').textContent=video?.description||'';$('actions').hidden=!video;const summary=video&&state.latest?.action==='summarize'?state.latest.summary:'';$('summary').textContent=summary||'';$('summary').hidden=!summary;document.querySelectorAll('.result').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.video===selected)))}
function render(next){if(disposed)return;state=next||{};document.body.dataset.mode=state.view_mode||'channel';for(const mode of ['channel','research'])$('mode-'+mode).setAttribute('aria-pressed',String(mode===(state.view_mode||'channel')));document.querySelector('.view-switch').setAttribute('aria-label',copy('layout'));document.documentElement.lang=state.lang||'en';document.querySelectorAll('[data-copy]').forEach(e=>e.textContent=copy(e.dataset.copy));document.querySelector('h1').textContent=copy(state.view_mode==='research'?'research_title':'title');document.querySelector('.intro').textContent=copy(state.view_mode==='research'?'research_intro':'intro');$('query').placeholder=copy('query');$('warning').textContent=state.warning||'';$('warning').hidden=!state.warning;
const ct=JSON.stringify([state.uploads,state.regulars,state.lang]);if(ct!==channelToken){channelToken=ct;const rows=state.uploads||[];activity(rows);$('uploads').replaceChildren(...rows.map(row=>{const li=element('li','','publication');li.append(element('h3',row.title),element('small',row.uploaded_at?.slice(0,10)),element('span',copy(row.privacy)||copy('unknown'),'badge'));if(row.tags?.length)li.append(element('small',row.tags.join(' · ')));return li}));$('empty-uploads').hidden=!!rows.length;const regulars=state.regulars||[];$('history').hidden=!regulars.length;$('regulars').replaceChildren(...regulars.map(r=>element('li',`${r.channel} · ${r.count}`)))}
const rt=JSON.stringify([state.latest,state.lang]);if(rt!==resultToken){resultToken=rt;const rows=videos();if(!rows.some(v=>v.id===selected))selected=rows[0]?.id||'';$('results').replaceChildren(...rows.map((v,i)=>{const b=element('button','','result arrive');b.type='button';b.dataset.video=v.id;b.setAttribute('aria-pressed',String(v.id===selected));const text=element('span');text.append(element('span',v.title,'name'),element('small',v.channel));b.append(thumbnail(v),text);b.onclick=()=>{selected=v.id;showDetail();cosmos.resize(document.body.scrollHeight);if(matchMedia('(max-width:700px)').matches)$('detail').scrollIntoView({behavior:'instant',block:'start'})};return b}));$('empty-results').hidden=!!rows.length;$('empty-results').textContent=copy(state.latest?.action?'no_results':'empty_results');$('updated').textContent=[state.latest?.query,state.latest?.updated_at].filter(Boolean).join(' · ');showDetail()}setBusy(busy);motion();cosmos.resize(document.body.scrollHeight)}
async function call(action,query,extra={}){if(busy||disposed)return;setBusy(true);status(copy('pending'),true);try{const result=await cosmos.call('youtube',{action,query,...extra});if(disposed)return;status(typeof result==='string'?result:JSON.stringify(result));}catch{if(!disposed)status(copy('error'));}finally{if(!disposed)setBusy(false)}}
document.querySelector('#search button[type="submit"]').onclick=e=>{e.preventDefault();const query=$('query').value.trim();if(!query){status(copy('missing_query'));$('query').focus();return}call('search',query)};
for(const mode of ['channel','research'])$('mode-'+mode).onclick=()=>call('layout','',{view_mode:mode});$('back-results').onclick=()=>$('results').scrollIntoView({behavior:'instant',block:'start'});$('search').onsubmit=e=>{e.preventDefault();document.querySelector('#search button[type=submit]').click()};
$('trending').onclick=()=>call('trending','');for(const action of ['open','info','summarize'])$(action).onclick=()=>{if(selected)call(action==='open'?'play':action,selected)};
$('detail-image').onerror=()=>{$('detail-image').hidden=true};$('motion').onclick=()=>{paused=!paused;motion()};const reduce=()=>{paused=reduced.matches;motion()};reduced.addEventListener('change',reduce);cosmos.onState(render);cosmos.onLifecycle(event=>{visible=event.visible!==false;if(event.disposed){disposed=true;reduced.removeEventListener('change',reduce)}motion()});
})();
</script></body></html>
