<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f1f0ed;background:#13161c;font-size:15px}
*{box-sizing:border-box}body{margin:0;padding:28px;line-height:1.6}button,input{font:inherit}button{cursor:pointer;border:1px solid #485263;background:#262e3c;color:inherit;border-radius:10px;padding:9px 14px;transition:background .18s,transform .18s}button:hover{background:#38465c}button:active{transform:translateY(1px)}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #8bceff;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,4vw,38px);font-weight:650;letter-spacing:-.035em;line-height:1.2}h2{font-size:19px}h3{font-size:16px}small,.muted{color:#b2bbc8}.eyebrow{font-size:11px;color:#ffa999;letter-spacing:.2em;font-weight:700;margin-bottom:12px}.intro{margin-top:12px;max-width:650px}.layout{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.7fr);gap:22px;margin-top:28px}.panel{border:1px solid #303947;border-radius:18px;padding:22px;background:linear-gradient(145deg,#202630,#181d26)}.panel>p{margin:8px 0 18px;font-size:13px}.timeline{list-style:none;padding:0;margin:18px 0;border-left:2px solid #5b4248}.publication{position:relative;padding:0 0 24px 19px;overflow-wrap:anywhere}.publication:before{content:'';position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:#ffa999}.publication small{display:block;margin-top:6px}.badge{display:inline-block;margin-top:8px;padding:3px 8px;background:#323c4b;border-radius:6px;font-size:12px}.help{border-top:1px solid #394351;padding-top:16px}.search{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}label{display:block;font-size:13px;color:#c3cbd6}.query{width:100%;min-width:0;background:#101722;border:1px solid #536077;border-radius:10px;color:#fff;padding:12px}.search .primary{background:#edac9c;color:#251b1c;border-color:transparent;font-weight:650}.results{display:grid;gap:9px;margin-top:14px;max-height:320px;overflow-y:auto;padding:3px}.result{display:grid;grid-template-columns:32px 1fr;text-align:left;gap:10px;width:100%;padding:13px;background:#1b2330}.result[aria-pressed=true]{background:#344354;border-color:#8bceff}.result .number{color:#ffa999;font-size:20px;font-variant-numeric:tabular-nums}.result .name{display:block;font-weight:600;overflow-wrap:anywhere}.result small{display:block}.detail{margin-top:20px;border-top:1px solid #414b5c;padding-top:18px}.detail h3{margin:10px 0}.description,.summary{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.description{max-height:190px;overflow:auto;color:#c8d0dc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.basis{font-size:12px;color:#f0cda7;border-left:3px solid #f0cda7;padding-left:10px;margin:16px 0}.summary{background:#101722;padding:15px;border-radius:10px}.notice{margin-top:18px;padding:12px 16px;border:1px solid #7184a1;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}.warning{color:#ffd3b0;border-color:#ac8060}footer{margin-top:24px;font-size:12px;color:#acb7c7}.regulars{margin-top:22px}.regulars ul{padding-left:18px;font-size:14px}.updated{font-size:12px;color:#9fafc3}.arrive{animation:arrive .24s ease-out}.busy:before{content:'';display:inline-block;width:9px;height:9px;background:#8bceff;border-radius:50%;margin-right:10px;animation:pulse .8s ease-in-out infinite alternate}[hidden]{display:none!important}@keyframes arrive{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes pulse{to{opacity:.35}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}@media(max-width:700px){body{padding:16px}.layout{grid-template-columns:1fr;gap:16px}.panel{padding:18px}.timeline{max-height:220px;overflow:auto}.search button{flex:1}.results{max-height:280px}}
body.quiet *,body.quiet *:before{animation-play-state:paused!important}
</style></head><body>
<header><p class="eyebrow">YOUTUBE / COSMOS</p><h1 data-copy="title"></h1><p class="intro muted" data-copy="intro"></p></header>
<div id="warning" class="notice warning" role="status" hidden></div>
<main class="layout">
<section class="panel" aria-labelledby="publications-title"><h2 id="publications-title" data-copy="channel"></h2><p class="muted" data-copy="recorded"></p><ol id="uploads" class="timeline"></ol><p id="empty-uploads" class="muted" data-copy="empty_uploads"></p><p class="help muted" data-copy="upload_help"></p><section id="history" class="regulars" hidden><h3 data-copy="history"></h3><ul id="regulars"></ul><small data-copy="history_help"></small></section></section>
<section class="panel" aria-labelledby="research-title"><h2 id="research-title" data-copy="research"></h2><form id="search" class="search"><label for="query" data-copy="query"></label><input id="query" class="query" autocomplete="off" maxlength="300"><button class="primary" type="submit" data-copy="search"></button><button id="trending" type="button" data-copy="trending"></button></form><h3 data-copy="results"></h3><p id="updated" class="updated"></p><div id="results" class="results"></div><p id="empty-results" class="muted"></p>
<section class="detail" aria-labelledby="detail-title"><small data-copy="detail"></small><h3 id="detail-title"></h3><p id="channel" class="muted"></p><p id="description" class="description"></p><div id="actions" class="actions" hidden><button id="open" data-copy="open"></button><button id="info" data-copy="info"></button><button id="summarize" data-copy="summarize"></button></div><p class="basis" data-copy="basis"></p><p id="summary" class="summary" hidden></p></section>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div></section></main><footer data-copy="privacy"></footer>
<script>
(()=>{'use strict';
let state={},selected='',resultToken='',channelToken='',busy=false,disposed=false;
const $=id=>document.getElementById(id),copy=k=>state.copy?.[k]||'',videos=()=>state.latest?.videos||[];
function element(tag,text,cls){const e=document.createElement(tag);e.textContent=text||'';if(cls)e.className=cls;return e}
function status(text,pending=false){$('notice').textContent=text;$('notice').hidden=!text;$('notice').classList.toggle('busy',pending)}
function setBusy(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value);$('search').setAttribute('aria-busy',String(value))}
function showDetail(){const video=videos().find(v=>v.id===selected);$('detail-title').textContent=video?.title||copy('choose');$('channel').textContent=video?.channel||'';$('description').textContent=video?.description||'';$('actions').hidden=!video;const summary=video&&state.latest?.action==='summarize'?state.latest.summary:'';$('summary').textContent=summary||'';$('summary').hidden=!summary;document.querySelectorAll('.result').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.video===selected)))}
function render(next){if(disposed)return;state=next||{};document.documentElement.lang=state.lang||'en';document.querySelectorAll('[data-copy]').forEach(e=>e.textContent=copy(e.dataset.copy));$('query').placeholder=copy('query');$('warning').textContent=state.warning||'';$('warning').hidden=!state.warning;
const ct=JSON.stringify([state.uploads,state.regulars,state.lang]);if(ct!==channelToken){channelToken=ct;const rows=state.uploads||[];$('uploads').replaceChildren(...rows.map(row=>{const li=element('li','','publication');li.append(element('h3',row.title),element('small',row.uploaded_at?.slice(0,10)),element('span',copy(row.privacy)||copy('unknown'),'badge'));if(row.tags?.length)li.append(element('small',row.tags.join(' · ')));return li}));$('empty-uploads').hidden=!!rows.length;const regulars=state.regulars||[];$('history').hidden=!regulars.length;$('regulars').replaceChildren(...regulars.map(r=>element('li',`${r.channel} · ${r.count}`)))}
const rt=JSON.stringify([state.latest,state.lang]);if(rt!==resultToken){resultToken=rt;const rows=videos();if(!rows.some(v=>v.id===selected))selected=rows[0]?.id||'';$('results').replaceChildren(...rows.map((v,i)=>{const b=element('button','','result arrive');b.type='button';b.dataset.video=v.id;b.setAttribute('aria-pressed',String(v.id===selected));const text=element('span');text.append(element('span',v.title,'name'),element('small',v.channel));b.append(element('span',String(i+1).padStart(2,'0'),'number'),text);b.onclick=()=>{selected=v.id;showDetail()};return b}));$('empty-results').hidden=!!rows.length;$('empty-results').textContent=copy(state.latest?.action?'no_results':'empty_results');$('updated').textContent=[state.latest?.query,state.latest?.updated_at].filter(Boolean).join(' · ');showDetail()}setBusy(busy)}
async function call(action,query){if(busy||disposed)return;setBusy(true);status(copy('pending'),true);try{const result=await cosmos.call('youtube',{action,query});if(disposed)return;status(typeof result==='string'?result:JSON.stringify(result));}catch{if(!disposed)status(copy('error'));}finally{if(!disposed)setBusy(false)}}
document.querySelector('#search button[type="submit"]').onclick=e=>{e.preventDefault();const query=$('query').value.trim();if(!query){status(copy('missing_query'));$('query').focus();return}call('search',query)};
$('trending').onclick=()=>call('trending','');for(const action of ['open','info','summarize'])$(action).onclick=()=>{if(selected)call(action==='open'?'play':action,selected)};
cosmos.onState(render);cosmos.onLifecycle(event=>{if(event.disposed){disposed=true}document.body.classList.toggle('quiet',event.visible===false||disposed)});
})();
</script></body></html>
