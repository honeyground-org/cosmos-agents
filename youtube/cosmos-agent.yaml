# YouTube — Cosmos market agent manifest
# Spec: https://github.com/honeyground-org/cosmos-billy/blob/main/docs/AGENT_GUIDE.md
#
# ★The source text is English★ Per-language text lives in the market index
# entry (`title_i18n` / `description_i18n`) — readers see their own language and
# fall back to English when one is missing.
id: honeyground-org/youtube
type: feature
version: 0.4.1
contract: plugin/v1
title: YouTube
# ★설치 화면은 코드를 받기 **전에** 그려진다★ — 그래서 무엇을 기억하는지가 여기
# 없으면 사용자는 설치한 뒤에야 그것을 알게 된다.
description: >-
  A creator's channel and reference workspace. Keeps your recorded uploads,
  titles, tags and privacy for the next publishing decision. On Cosmos 0.3.0 or
  later, search, select, inspect and summarize references beside your publication
  history. Latest results are private user-scoped working state, not inferred
  interests. Explicit lookups and opening requests use Cosmos memory; opening
  never means a video was watched. Summaries use only titles and descriptions,
  not video content or captions. Connect Google in agent settings; an API key
  is optional for reading. Uploads require an explicit request and publishing
  permission. The view is not a live synchronization of your YouTube channel.
author: honeyground-org
license: MIT
homepage: https://github.com/honeyground-org/cosmos-agents/tree/main/youtube
entry: youtube_scout:YouTubePlugin
tools:
  - youtube
# ⚠️ 로더가 **코드 ∪ 매니페스트**로 역량을 넓히므로 둘이 어긋나면 승인된 것과 집행되는
# 것이 갈린다. 코드의 `capabilities`와 반드시 같아야 한다.
#
# ★`media.publish`가 여기 있는 이유★ 나머지는 남의 것을 읽는 역량이고 이것만
# **내 이름으로 세상에 내놓는** 역량이다. 설치 화면에서 사용자는 그 한 줄을 보고
# 승인한다 — 역량이 없으면 그 고지도 없다.
capabilities:
  - network
  - browser
  - media.publish
  - memory
brain:
  stores: [item, org]
  reads: [item, org]
  settled: "Recorded uploads and explicit channel lookups support future publishing decisions. Search lists remain user-scoped working state; video titles are not inferred interests and opening requests are not verified watching."
requires_desktop: false
