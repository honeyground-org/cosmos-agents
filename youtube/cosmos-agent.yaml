# YouTube — Cosmos market agent manifest
# Spec: https://github.com/honeyground-org/cosmos-billy/blob/main/docs/AGENT_GUIDE.md
#
# ★The source text is English★ Per-language text lives in the market index
# entry (`title_i18n` / `description_i18n`) — readers see their own language and
# fall back to English when one is missing.
id: honeyground-org/youtube
type: feature
version: 0.2.0
contract: plugin/v1
title: YouTube
# ★설치 화면은 코드를 받기 **전에** 그려진다★ — 그래서 무엇을 기억하는지가 여기
# 없으면 사용자는 설치한 뒤에야 그것을 알게 된다.
description: >-
  For people who publish, not just watch. It keeps your own uploads -- the
  titles, the tags, when each one went out -- and hands them back the next time
  you publish, so a channel stops being a pile of things you half remember. Its
  screen is your channel: what you put out, who can see each one, and how long
  it has been since the last one. It never turns a video title into a fact about
  you: a title is what someone wrote to get a click that afternoon. What it does
  keep, on the watching side, is the channel you keep coming back to -- and only
  after you actually come back, because once is an event and twice is a taste.
  One click connects your account for both searching and uploading; nothing has
  to be pasted anywhere.
author: honeyground-org
license: MIT
homepage: https://github.com/honeyground-org/cosmos-agents/tree/main/youtube
entry: youtube_scout:YouTubePlugin
tools:
  - youtube
# ⚠️ 로더가 **코드 ∪ 매니페스트**로 역량을 넓히므로 둘이 어긋나면 승인된 것과 집행되는
# 것이 갈린다. 코드의 `capabilities`와 반드시 같아야 한다.
#
# ★`media.publish`가 여기 있는 이유★ 나머지는 남의 것을 읽는 역량이고 이것만
# **내 이름으로 세상에 내놓는** 역량이다. 설치 화면에서 사용자는 그 한 줄을 보고
# 승인한다 — 역량이 없으면 그 고지도 없다.
capabilities:
  - network
  - browser
  - media.publish
  - memory
requires_desktop: false
